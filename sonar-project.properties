# SonarQube/SonarCloud configuration for QLACK TypeScript
sonar.projectKey=qlack_QLACK-TypeScript
sonar.projectName=QLACK TypeScript

# Source encoding
sonar.sourceEncoding=UTF-8

# Source and test paths for monorepo
sonar.sources=projects/qlack/form-validation/src,projects/qlack/forms/src,projects/qlack/qng-pubsub/src
sonar.tests=projects/qlack/form-validation/src,projects/qlack/forms/src,projects/qlack/qng-pubsub/src

# File exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,coverage/**,**/*.spec.ts
sonar.test.inclusions=**/*.spec.ts

# TypeScript/JavaScript specific settings
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Coverage reports (Karma/coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Skip if no coverage reports are found
sonar.javascript.lcov.reportPaths=coverage/lcov.info,projects/qlack/*/coverage/lcov.info
